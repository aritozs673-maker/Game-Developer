<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Detrás de la Pantalla</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

<div id="background">
<div class="sky"></div>
<div class="window"></div>
<div class="board"><span>MATEMÁTICAS</span></div>
<div class="clock">10:24</div>
<div class="floor"></div>
<div class="desk desk1"></div>
<div class="desk desk2"></div>

<div class="desk desk4"></div>
<div class="desk desk5"></div>
<div class="locker left"></div>
<div class="locker right"></div>
<div class="hall-lockers"></div>
<div class="hall-floor"></div>
</div>

<div id="particles"></div>

<div id="topbar">
<div id="gameTitle">DETRÁS DE LA PANTALLA</div>
<div id="perspective">PERSPECTIVA · ALEX</div>
</div>

<div id="location">AULA · 10:24</div>

<div id="characters">

<div class="character alex" id="alex">
<div class="shadow"></div>
<div class="head">
<div class="hair"></div>
<div class="eye e1"></div>
<div class="eye e2"></div>
<div class="mouth"></div>
</div>
<div class="neck"></div>
<div class="body">
<div class="shirtSymbol">♡</div>
</div>
<div class="name">ALEX</div>
</div>

<div class="character mateo" id="mateo">
<div class="shadow"></div>
<div class="head">
<div class="hair"></div>
<div class="eye e1"></div>
<div class="eye e2"></div>
<div class="mouth"></div>
</div>
<div class="neck"></div>
<div class="body">
<div class="shirtSymbol">✦</div>
</div>
<div class="name">MATEO</div>
</div>

<div class="character dani" id="dani">
<div class="shadow"></div>
<div class="head">
<div class="hair"></div>
<div class="eye e1"></div>
<div class="eye e2"></div>
<div class="mouth"></div>
</div>
<div class="neck"></div>
<div class="body">
<div class="shirtSymbol">✧</div>
</div>
<div class="name">DANI</div>
</div>

</div>

<div id="phone">

<div class="phone-top">
<span>9:41</span>
<span>● ● ●</span>
</div>

<div id="phone-screen"></div>

</div>

<div id="notification"></div>

<div id="dialogue-box">

<div id="speaker">NARRADOR</div>

<div id="dialogue"></div>

<button id="next">▶</button>

</div>

<div id="choices"></div>

<div id="emotion"></div>

<div id="transition">

<div id="transition-title"></div>

<div id="transition-sub"></div>

</div>

</div>

<script src="script.js"></script>
</body>
</html>
