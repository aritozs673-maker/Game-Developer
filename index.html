<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Parisienne&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 18% 18%,
                    rgba(255,255,255,0.95),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 82% 78%,
                    rgba(226,174,190,0.40),
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    #f9e9ee,
                    #f3dce4,
                    #ead2dc
                );

            color: #513b44;

            font-family: "Cormorant Garamond", serif;

        }


        /* FONDO */

        .fondo {

            position: fixed;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

        }


        .brillo {

            position: absolute;

            width: 330px;

            height: 330px;

            border-radius: 50%;

            background: rgba(255,255,255,0.28);

            filter: blur(55px);

        }


        .brillo.uno {

            top: -120px;

            left: -90px;

        }


        .brillo.dos {

            right: -130px;

            bottom: -120px;

            width: 430px;

            height: 430px;

            background: rgba(208,158,176,0.20);

        }


        /* ESTRELLAS */

        .estrella {

            position: absolute;

            color: rgba(91,65,75,0.48);

            font-size: 15px;

            animation: flotar 5s ease-in-out infinite;

        }


        .e1 {
            top: 12%;
            left: 13%;
        }

        .e2 {
            top: 20%;
            right: 15%;
            animation-delay: 1s;
        }

        .e3 {
            top: 53%;
            left: 8%;
            animation-delay: 2s;
        }

        .e4 {
            bottom: 18%;
            right: 18%;
            animation-delay: 1.5s;
        }

        .e5 {
            bottom: 13%;
            left: 20%;
            animation-delay: 2.5s;
        }

        .e6 {
            top: 38%;
            right: 7%;
            animation-delay: 3s;
        }


        @keyframes flotar {

            0%, 100% {

                transform: translateY(0);

                opacity: .35;

            }

            50% {

                transform: translateY(-10px);

                opacity: .85;

            }

        }


        /* CONTENIDO */

        .bienvenida {

            position: relative;

            z-index: 2;

            width: 100%;

            height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px;

        }


        .decoracion {

            font-size: 20px;

            letter-spacing: 13px;

            color: #80616c;

            margin-bottom: 22px;

            opacity: 0;

            animation: aparecer 1.2s ease forwards;

        }


        /* TITULO */

        h1 {

            font-family: "Cormorant Garamond", serif;

            font-size: clamp(65px, 11vw, 135px);

            font-weight: 300;

            line-height: .88;

            letter-spacing: 8px;

            color: #543d46;

            opacity: 0;

            animation: aparecerTitulo 1.6s ease forwards .3s;

        }


        .subtitulo {

            font-family: "Parisienne", cursive;

            font-size: clamp(42px, 6vw, 70px);

            color: #76515d;

            margin-top: 22px;

            transform: rotate(-3deg);

            opacity: 0;

            animation: aparecerSubtitulo 1.4s ease forwards .8s;

        }


        .descripcion {

            max-width: 500px;

            margin-top: 25px;

            font-size: 19px;

            line-height: 1.7;

            color: #69525b;

            opacity: 0;

            animation: aparecer 1.3s ease forwards 1.2s;

        }


        /* BOTON */

        .boton {

            margin-top: 38px;

            padding: 14px 38px;

            border:

                1px solid

                rgba(84,61,70,.42);

            border-radius: 50px;

            background:

                rgba(255,255,255,.20);

            backdrop-filter: blur(10px);

            color: #543d46;

            font-family: "Cormorant Garamond", serif;

            font-size: 17px;

            letter-spacing: 3px;

            cursor: pointer;

            transition: .35s ease;

            opacity: 0;

            animation: aparecer 1.3s ease forwards 1.6s;

        }


        .boton:hover {

            background: #543d46;

            color: #faeaf0;

            transform: translateY(-4px);

            box-shadow:

                0 14px 30px

                rgba(84,61,70,.16);

        }


        .estrellas-abajo {

            position: absolute;

            bottom: 28px;

            font-size: 17px;

            letter-spacing: 10px;

            color: #80616c;

            opacity: .65;

        }


        /* ANIMACIONES */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform: translateY(18px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        @keyframes aparecerTitulo {

            from {

                opacity: 0;

                transform: translateY(25px);

                letter-spacing: 20px;

            }

            to {

                opacity: 1;

                transform: translateY(0);

                letter-spacing: 8px;

            }

        }


        @keyframes aparecerSubtitulo {

            from {

                opacity: 0;

                transform:

                    rotate(-3deg)

                    translateY(20px);

            }

            to {

                opacity: 1;

                transform:

                    rotate(-3deg)

                    translateY(0);

            }

        }


        /* CELULAR */

        @media (max-width: 600px) {

            h1 {

                font-size: 58px;

                letter-spacing: 5px;

            }

            .subtitulo {

                font-size: 42px;

            }

            .descripcion {

                max-width: 330px;

                font-size: 16px;

            }

            .decoracion {

                font-size: 15px;

                letter-spacing: 8px;

            }

        }

    </style>

</head>


<body>


    <div class="fondo">

        <div class="brillo uno"></div>

        <div class="brillo dos"></div>

        <span class="estrella e1">✦</span>

        <span class="estrella e2">✧</span>

        <span class="estrella e3">⋆</span>

        <span class="estrella e4">✦</span>

        <span class="estrella e5">✧</span>

        <span class="estrella e6">⋆</span>

    </div>


    <main class="bienvenida">


        <div class="decoracion">
            ✦　✧　⋆　✧　✦
        </div>


        <h1>
            GAME<br>
            DEVELOPER
        </h1>


        <div class="subtitulo">
            mis juegos
        </div>


        <p class="descripcion">

            Una pequeña colección de mundos
            creados con código, creatividad
            e imaginación.

        </p>


        <button
            class="boton"
            onclick="entrar()"
        >

            VER LOS JUEGOS

        </button>


        <div class="estrellas-abajo">

            ✧　✦　⋆　♡　⋆　✦　✧

        </div>


    </main>


    <script>

        function entrar() {

            window.location.href = "juegos.html";

        }

    </script>


</body>

</html>
