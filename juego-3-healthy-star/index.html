<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Healthy Star ⭐</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at top,#18264b,#080c1d 70%);color:white;font-family:"Trebuchet MS",Arial,sans-serif;display:flex;justify-content:center;align-items:center;overflow:hidden}
#game{width:min(1100px,96vw);text-align:center}
h1{font-size:clamp(30px,5vw,55px);margin-bottom:5px;color:#ffe66d;text-shadow:0 0 10px #ffe66d,0 0 30px rgba(255,230,109,.5)}
.subtitle{opacity:.8;margin-bottom:12px}
#hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:15px;padding:9px 14px;backdrop-filter:blur(10px)}
#levelText{color:#8be9fd}#healthyText{color:#8cff98}#timerText{color:#ffd166}
#gameArea{position:relative;width:100%;aspect-ratio:16/9;max-height:70vh;border-radius:25px;overflow:hidden;border:3px solid rgba(255,255,255,.18);box-shadow:0 0 40px rgba(0,0,0,.7),inset 0 0 50px rgba(0,0,0,.6);background:#050812}
canvas{width:100%;height:100%;display:block}
#messageScreen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;background:radial-gradient(circle,rgba(25,40,85,.95),rgba(4,7,20,.98));z-index:20}
.starBig{font-size:100px;animation:floatStar 2s ease-in-out infinite,starGlow 1.5s ease-in-out infinite alternate;margin-bottom:10px}
@keyframes floatStar{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-15px) rotate(5deg)}}
@keyframes starGlow{from{filter:drop-shadow(0 0 5px #ffe66d) drop-shadow(0 0 15px #ffe66d)}to{filter:drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #ffe66d)}}
#messageTitle{font-size:clamp(28px,5vw,50px);color:#ffe66d;margin-bottom:12px}
#message{max-width:700px;line-height:1.6;font-size:clamp(15px,2vw,21px);opacity:.95;margin-bottom:22px}
button{border:none;cursor:pointer;padding:13px 28px;border-radius:30px;font-size:18px;font-weight:bold;color:#101426;background:linear-gradient(135deg,#ffe66d,#ffb703);box-shadow:0 5px 20px rgba(255,183,3,.35);transition:.2s}
button:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 8px 30px rgba(255,230,109,.5)}
button:active{transform:scale(.97)}
#controls{display:flex;justify-content:center;margin-top:10px}
#controlPad{display:grid;grid-template-columns:repeat(3,55px);grid-template-rows:repeat(2,55px);gap:5px}
.controlButton{padding:0;width:55px;height:55px;border-radius:15px;background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,255,255,.15);box-shadow:none}
.controlButton:hover{background:rgba(255,255,255,.2)}
.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%) translateY(-20px);background:rgba(10,15,35,.92);border:1px solid rgba(255,255,255,.2);padding:12px 20px;border-radius:20px;opacity:0;pointer-events:none;transition:.3s;z-index:10;font-weight:bold}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.good{color:#8cff98}.bad{color:#ff7b8a}
#endScreen{position:absolute;inset:0;display:none;justify-content:center;align-items:center;flex-direction:column;background:rgba(4,7,20,.94);z-index:30;padding:25px}
#endIcon{font-size:90px;margin-bottom:15px}#endTitle{font-size:45px;color:#ffe66d;margin-bottom:10px}#endText{max-width:650px;line-height:1.6;margin-bottom:20px}
@media(max-width:600px){#game{width:98vw}.stat{font-size:13px;padding:7px 9px}#hud{justify-content:center}.starBig{font-size:75px}#message{font-size:15px}}
</style>
</head>
<body>
<div id="game">
<h1>⭐ Healthy Star</h1>
<div class="subtitle">¡Ayuda a Estrellita a elegir alimentos saludables!</div>
<div id="hud">
<div class="stat" id="levelText">🌟 Nivel 1</div>
<div class="stat" id="healthyText">🍎 Saludables: 0/0</div>
<div class="stat" id="timerText">⏱️ 00:00</div>
<div class="stat">👁️ Visión: <span id="visionText">1</span></div>
</div>
<div id="gameArea">
<canvas id="canvas"></canvas>
<div id="toast"></div>
<div id="messageScreen">
<div class="starBig">⭐</div>
<div id="messageTitle">Nivel 1</div>
<div id="message">Comer saludable ayuda a nuestro cuerpo a tener energía para jugar, estudiar y crecer.</div>
<button id="startButton">¡JUGAR! ⭐</button>
</div>
<div id="endScreen">
<div id="endIcon">🏆</div>
<div id="endTitle">¡Victoria!</div>
<div id="endText"></div>
<button id="restartButton">Jugar otra vez</button>
</div>
</div>
<div id="controls">
<div id="controlPad">
<button class="controlButton up" data-key="ArrowUp">▲</button>
<button class="controlButton left" data-key="ArrowLeft">◀</button>
<button class="controlButton down" data-key="ArrowDown">▼</button>
<button class="controlButton right" data-key="ArrowRight">▶</button>
</div>
</div>
<p style="opacity:.55;margin-top:8px;font-size:13px">Usa las flechas del teclado o los botones para moverte.</p>
</div>

<script>
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d"),gameArea=document.getElementById("gameArea");
function resizeCanvas(){canvas.width=gameArea.clientWidth;canvas.height=gameArea.clientHeight}resizeCanvas();window.addEventListener("resize",resizeCanvas);
const messageScreen=document.getElementById("messageScreen"),messageTitle=document.getElementById("messageTitle"),message=document.getElementById("message"),startButton=document.getElementById("startButton"),endScreen=document.getElementById("endScreen"),endTitle=document.getElementById("endTitle"),endText=document.getElementById("endText"),endIcon=document.getElementById("endIcon"),restartButton=document.getElementById("restartButton"),toast=document.getElementById("toast"),levelText=document.getElementById("levelText"),healthyText=document.getElementById("healthyText"),timerText=document.getElementById("timerText"),visionText=document.getElementById("visionText");
const levels=[
{time:90,vision:115,healthy:3,unhealthy:3,message:"Las frutas y verduras aportan vitaminas y nutrientes que ayudan a nuestro cuerpo a crecer y mantenerse fuerte."},
{time:75,vision:105,healthy:4,unhealthy:4,message:"Tomar agua es importante porque ayuda a mantener nuestro cuerpo hidratado durante el día."},
{time:65,vision:95,healthy:5,unhealthy:5,message:"Una alimentación variada nos ayuda a obtener diferentes nutrientes que nuestro cuerpo necesita."},
{time:55,vision:85,healthy:6,unhealthy:6,message:"Los alimentos muy azucarados pueden resultar atractivos, pero debemos aprender a elegir opciones más nutritivas."},
{time:45,vision:75,healthy:7,unhealthy:8,message:"¡Último reto! Piensa antes de elegir: una buena decisión alimentaria puede darte energía para continuar."}
];
let currentLevel=0,levelData,gameRunning=false,timeLeft=0,timerInterval=null,visionRadius=100,foods=[],walls=[],particles=[],keys={},score=0;
const player={x:0,y:0,radius:18,speed:3.2,angle:0,squash:0};
function distance(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2)}
function circleRectCollision(c,r){const x=Math.max(r.x,Math.min(c.x,r.x+r.w)),y=Math.max(r.y,Math.min(c.y,r.y+r.h));return (c.x-x)**2+(c.y-y)**2<c.radius**2}
function canMove(x,y){const t={x,y,radius:player.radius};return !walls.some(w=>circleRectCollision(t,w))}
function createMaze(){
walls=[];const W=canvas.width,H=canvas.height;
walls.push({x:0,y:0,w:W,h:15},{x:0,y:H-15,w:W,h:15},{x:0,y:0,w:15,h:H},{x:W-15,y:0,w:15,h:H});
const ww=18;
[[.18,.12,.02,.38],[.18,.65,.02,.25],[.35,.08,.02,.35],[.35,.55,.02,.35],[.52,.12,.02,.38],[.52,.65,.02,.25],[.69,.08,.02,.35],[.69,.55,.02,.35],[.82,.25,.02,.45]].forEach(p=>walls.push({x:W*p[0],y:H*p[1],w:W*p[2]+ww,h:H*p[3]}));
[[.05,.28,.28],[.43,.28,.20],[.76,.28,.18],[.20,.72,.22],[.48,.72,.20],[.78,.72,.15]].forEach(p=>walls.push({x:W*p[0],y:H*p[1],w:W*p[2],h:ww}));
}
function randomPosition(){
let p,attempts=0;do{p={x:35+Math.random()*(canvas.width-70),y:35+Math.random()*(canvas.height-70)};attempts++}while(attempts<500&&(walls.some(w=>circleRectCollision({x:p.x,y:p.y,radius:25},w))||distance(p.x,p.y,player.x,player.y)<100));return p;
}
function createFoods(){
foods=[];const healthy=["🍎","🍌","🥕","🥦","🍓","🍊","🍇","🥝","🥑","🍐"],unhealthy=["🍔","🍟","🍕","🍩","🍭","🍫","🧁","🥤","🍪"];
for(let i=0;i<levelData.healthy;i++){const p=randomPosition();foods.push({x:p.x,y:p.y,type:"healthy",emoji:healthy[Math.floor(Math.random()*healthy.length)],eaten:false,pulse:Math.random()*6.28})}
for(let i=0;i<levelData.unhealthy;i++){const p=randomPosition();foods.push({x:p.x,y:p.y,type:"unhealthy",emoji:unhealthy[Math.floor(Math.random()*unhealthy.length)],eaten:false,pulse:Math.random()*6.28})}
}
function createParticles(x,y,type){for(let i=0;i<15;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:1,type,size:3+Math.random()*5})}
function updateParticles(dt){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt*2});particles=particles.filter(p=>p.life>0)}
let toastTimeout;function showToast(text,type){toast.textContent=text;toast.className="show "+type;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toast.className="",1800)}
function checkFood(){
foods.forEach(food=>{
if(food.eaten)return;
if(distance(player.x,player.y,food.x,food.y)<28){
food.eaten=true;createParticles(food.x,food.y,food.type);
if(food.type==="healthy"){visionRadius+=45;score+=100;showToast("🍎 ¡Excelente elección! ¡Tu visión aumenta!","good");player.squash=1}
else{visionRadius=Math.max(55,visionRadius-35);score=Math.max(0,score-30);showToast("🍔 ¡Cuidado! Tu visión se redujo.","bad")}
updateHUD();checkVictory();
}});
}
function checkVictory(){if(foods.filter(f=>f.type==="healthy"&&!f.eaten).length===0)nextLevel()}
function nextLevel(){gameRunning=false;clearInterval(timerInterval);currentLevel++;if(currentLevel>=levels.length){showEnd(true);return}showLevelMessage()}
function showLevelMessage(){levelData=levels[currentLevel];messageScreen.style.display="flex";messageTitle.textContent="⭐ Nivel "+(currentLevel+1);message.textContent=levelData.message;startButton.textContent="¡Comenzar nivel "+(currentLevel+1)+"!"}
function startLevel(){messageScreen.style.display="none";endScreen.style.display="none";gameRunning=true;timeLeft=levelData.time;visionRadius=levelData.vision;player.x=canvas.width/2;player.y=canvas.height/2;player.squash=0;createMaze();if(!canMove(player.x,player.y)){player.x=50;player.y=50}createFoods();updateHUD();startTimer();startMusic(currentLevel)}
function startTimer(){clearInterval(timerInterval);timerInterval=setInterval(()=>{if(!gameRunning)return;timeLeft--;updateHUD();if(timeLeft<=0){clearInterval(timerInterval);gameRunning=false;showEnd(false)}},1000)}
function updateHUD(){levelText.textContent="🌟 Nivel "+(currentLevel+1);const remaining=foods.filter(f=>f.type==="healthy"&&!f.eaten).length,total=foods.filter(f=>f.type==="healthy").length;healthyText.textContent="🍎 Saludables: "+(total-remaining)+"/"+total;const m=Math.floor(timeLeft/60).toString().padStart(2,"0"),s=(timeLeft%60).toString().padStart(2,"0");timerText.textContent="⏱️ "+m+":"+s;visionText.textContent=Math.round(visionRadius)}
function updatePlayer(){
if(!gameRunning)return;let dx=0,dy=0;
if(keys.ArrowUp||keys.w||keys.W)dy=-1;if(keys.ArrowDown||keys.s||keys.S)dy=1;if(keys.ArrowLeft||keys.a||keys.A)dx=-1;if(keys.ArrowRight||keys.d||keys.D)dx=1;
if(dx||dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;const nx=player.x+dx*player.speed,ny=player.y+dy*player.speed;if(canMove(nx,player.y))player.x=nx;if(canMove(player.x,ny))player.y=ny;player.angle+=.08}
}
function drawMaze(){
const W=canvas.width,H=canvas.height;ctx.fillStyle="#02040b";ctx.fillRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.arc(player.x,player.y,visionRadius,0,Math.PI*2);ctx.clip();
const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#151c38");g.addColorStop(1,"#080d22");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.strokeStyle="rgba(255,255,255,.035)";ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
walls.forEach(w=>{ctx.fillStyle="#26345c";ctx.fillRect(w.x,w.y,w.w,w.h);ctx.strokeStyle="#536aa5";ctx.lineWidth=2;ctx.strokeRect(w.x,w.y,w.w,w.h)});
foods.forEach(food=>{if(food.eaten)return;const pulse=Math.sin(performance.now()/300+food.pulse)*3;ctx.font=`${26+pulse}px Arial`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(food.emoji,food.x,food.y)});
ctx.restore();
const d=ctx.createRadialGradient(player.x,player.y,visionRadius*.45,player.x,player.y,visionRadius);d.addColorStop(0,"rgba(0,0,0,0)");d.addColorStop(.65,"rgba(0,0,0,.2)");d.addColorStop(1,"rgba(0,0,0,.98)");ctx.fillStyle=d;ctx.fillRect(0,0,W,H);
const glow=ctx.createRadialGradient(player.x,player.y,0,player.x,player.y,visionRadius);glow.addColorStop(0,"rgba(255,230,109,.08)");glow.addColorStop(.6,"rgba(255,230,109,.025)");glow.addColorStop(1,"rgba(255,230,109,0)");ctx.fillStyle=glow;ctx.fillRect(player.x-visionRadius,player.y-visionRadius,visionRadius*2,visionRadius*2);
}
function drawStar(){
const x=player.x,y=player.y;let scale=1+Math.sin(performance.now()/120)*.025;if(player.squash>0){scale+=player.squash*.15;player.squash-=.04;if(player.squash<0)player.squash=0}
ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(performance.now()/1000)*.04);ctx.scale(scale,scale);ctx.shadowColor="rgba(255,230,109,.8)";ctx.shadowBlur=25;
const spikes=5,outer=22,inner=11;ctx.beginPath();for(let i=0;i<10;i++){const r=i%2===0?outer:inner,a=i*Math.PI/5-Math.PI/2,px=Math.cos(a)*r,py=Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();
const sg=ctx.createRadialGradient(-5,-7,2,0,0,25);sg.addColorStop(0,"#fff9c4");sg.addColorStop(.35,"#ffe66d");sg.addColorStop(1,"#ffb703");ctx.fillStyle=sg;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle="#fff7ae";ctx.lineWidth=2;ctx.stroke();
ctx.fillStyle="#25213b";ctx.beginPath();ctx.arc(-7,-2,2.7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(7,-2,2.7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(0,2,7,0,Math.PI);ctx.strokeStyle="#25213b";ctx.lineWidth=2;ctx.stroke();ctx.restore();
}
function drawParticles(){particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.type==="healthy"?"#8cff98":"#ff7b8a";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1}
function gameLoop(){updatePlayer();checkFood();updateParticles(1/60);drawMaze();drawParticles();drawStar();requestAnimationFrame(gameLoop)}gameLoop();
window.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault()});window.addEventListener("keyup",e=>keys[e.key]=false);
document.querySelectorAll(".controlButton").forEach(b=>{const k=b.dataset.key;b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true});b.addEventListener("pointerup",e=>{e.preventDefault();keys[k]=false});b.addEventListener("pointerleave",()=>keys[k]=false)});
startButton.addEventListener("click",startLevel);
function showEnd(victory){gameRunning=false;clearInterval(timerInterval);stopMusic();endScreen.style.display="flex";if(victory){endIcon.textContent="🏆";endTitle.textContent="¡Healthy Star! ⭐";endText.textContent="¡Felicidades! Completaste todos los niveles. Estrellita aprendió que elegir alimentos saludables puede ayudarla a mantenerse con energía y superar retos."}else{endIcon.textContent="⏰";endTitle.textContent="¡Se acabó el tiempo!";endText.textContent="No te preocupes. Inténtalo otra vez y recuerda: debes encontrar y comer TODAS las comidas saludables antes de que se acabe el tiempo."}}
restartButton.addEventListener("click",()=>{currentLevel=0;score=0;endScreen.style.display="none";showLevelMessage()});
let audioContext=null,musicInterval=null,musicPlaying=false;
function startMusic(level){stopMusic();try{if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume();musicPlaying=true;const tempos=[500,420,350,280,190],tempo=tempos[level]||200,notes=[261.63,329.63,392,523.25,392,329.63];let index=0;musicInterval=setInterval(()=>{if(musicPlaying)playTone(notes[index++%notes.length],.16,level)},tempo)}catch(e){}}
function playTone(frequency,duration,level){if(!audioContext)return;const o=audioContext.createOscillator(),g=audioContext.createGain();o.frequency.value=frequency+level*8;o.type=level>=3?"sawtooth":"triangle";g.gain.setValueAtTime(.035,audioContext.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);o.connect(g);g.connect(audioContext.destination);o.start();o.stop(audioContext.currentTime+duration)}
function stopMusic(){musicPlaying=false;if(musicInterval){clearInterval(musicInterval);musicInterval=null}}
showLevelMessage();
</script>
</body>
</html>
